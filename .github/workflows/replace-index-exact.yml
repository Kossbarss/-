name: Replace index with exact cases section

on:
  push:
    branches:
      - claude/landing-page-redesign-bzy3r4
    paths:
      - .github/workflows/replace-index-exact.yml

permissions:
  contents: write

jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/landing-page-redesign-bzy3r4
          fetch-depth: 0

      - name: Fully rewrite index.html with exact section replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          start_marker = '  <!-- ============ CHAT TESTIMONIAL + CASES ============ -->'
          end_marker = '  <!-- ============ WHAT YOU GET ============ -->'
          start = html.find(start_marker)
          end = html.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Cases section boundaries were not found')

          exact = '''<section class="section">
  <div class="container">
    <!-- 1. Заголовок -->
    <div class="section-head"><h2>Это не просто курс…</h2></div>

    <!-- 2. Чат-моксап -->
    <div class="chat-mock">
      <div class="chat-head"><span>Общий чат выпускников школы</span><span>сейчас</span></div>
      <p><span class="author">Марта_ink:</span> Спасибо! 🙏 …</p>
    </div>

    <!-- 3. Підзаголовок -->
    <div class="section-head case-fan-head">
      <span class="kicker">Кейсы учеников</span>
      <h2>Кейсы учеников после обучения</h2>
    </div>

    <!-- 4. Віяло кейсів (малює script.js) -->
    <div class="case-fan-wrap">
      <div class="case-fan-layout" id="caseFanLayout"></div>
      <div class="case-fan-detail" id="caseFanDetail"></div>
      <div class="case-fan-nav" id="caseFanNav" hidden>
        <button class="case-fan-arrow" id="caseFanPrev">‹</button>
        <div class="case-fan-dots" id="caseFanDots"></div>
        <button class="case-fan-arrow" id="caseFanNext">›</button>
      </div>
    </div>

    <!-- 5. CTA: зірки + аватарки-тултіпи + кнопка -->
    <div class="case-fan-cta">
      <div class="stars">★★★★★</div>
      <div class="avatar-row">
        <div class="avatars">
          <div class="avatar-tip">
            <div class="avatar-tip-bubble">…ім'я/країна/роль…</div>
            <span class="avatar"></span>
          </div>
          <!-- ×5 аватарок -->
        </div>
        <span class="count">300+</span>
      </div>
      <a href="#pricing" class="btn btn-stardust"><span class="btn-stardust-wrap">Купить курс и начать обучение тату</span></a>
    </div>
  </div>
</section>'''

          updated = html[:start] + exact + '\n\n' + html[end:]
          path.write_text(updated, encoding='utf-8')

          written = path.read_text(encoding='utf-8')
          if exact not in written:
              raise SystemExit('Exact section verification failed')
          if written.count('<div class="section-head"><h2>Это не просто курс…</h2></div>') != 1:
              raise SystemExit('Exact heading count verification failed')
          PY

      - name: Commit rewritten index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace index with exact provided cases section"
          git push origin HEAD:claude/landing-page-redesign-bzy3r4
