name: Insert exact provided cases section

on:
  push:
    branches:
      - claude/landing-page-redesign-bzy3r4
    paths:
      - .github/workflows/insert-exact-cases-section.yml

permissions:
  contents: write

jobs:
  replace-section:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: claude/landing-page-redesign-bzy3r4
          fetch-depth: 0

      - name: Replace only the cases section
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          start_marker = '  <!-- ============ CHAT TESTIMONIAL + CASES ============ -->'
          end_marker = '  <!-- ============ WHAT YOU GET ============ -->'

          start = html.find(start_marker)
          end = html.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Cases section markers were not found')

          replacement = '''<section class="section">
  <div class="container">
    <!-- 1. Заголовок -->
    <div class="section-head"><h2>Это не просто курс…</h2></div>

    <!-- 2. Чат-моксап -->
    <div class="chat-mock">
      <div class="chat-head"><span>Общий чат выпускников школы</span><span>сейчас</span></div>
      <p><span class="author">Марта_ink:</span> Спасибо! 🙏 …</p>
    </div>

    <!-- 3. Підзаголовок -->
    <div class="section-head case-fan-head">
      <span class="kicker">Кейсы учеников</span>
      <h2>Кейсы учеников после обучения</h2>
    </div>

    <!-- 4. Віяло кейсів (малює script.js) -->
    <div class="case-fan-wrap">
      <div class="case-fan-layout" id="caseFanLayout"></div>
      <div class="case-fan-detail" id="caseFanDetail"></div>
      <div class="case-fan-nav" id="caseFanNav" hidden>
        <button class="case-fan-arrow" id="caseFanPrev">‹</button>
        <div class="case-fan-dots" id="caseFanDots"></div>
        <button class="case-fan-arrow" id="caseFanNext">›</button>
      </div>
    </div>

    <!-- 5. CTA: зірки + аватарки-тултіпи + кнопка -->
    <div class="case-fan-cta">
      <div class="stars">★★★★★</div>
      <div class="avatar-row">
        <div class="avatars">
          <div class="avatar-tip">
            <div class="avatar-tip-bubble">…ім'я/країна/роль…</div>
            <span class="avatar"></span>
          </div>
          <!-- ×5 аватарок -->
        </div>
        <span class="count">300+</span>
      </div>
      <a href="#pricing" class="btn btn-stardust"><span class="btn-stardust-wrap">Купить курс и начать обучение тату</span></a>
    </div>
  </div>
</section>

'''

          path.write_text(html[:start] + replacement + html[end:], encoding='utf-8')
          PY

      - name: Verify exact section text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              '<div class="section-head"><h2>Это не просто курс…</h2></div>',
              '<div class="chat-head"><span>Общий чат выпускников школы</span><span>сейчас</span></div>',
              '<p><span class="author">Марта_ink:</span> Спасибо! 🙏 …</p>',
              '<button class="case-fan-arrow" id="caseFanPrev">‹</button>',
              '<button class="case-fan-arrow" id="caseFanNext">›</button>',
              '<div class="avatar-tip-bubble">…ім\'я/країна/роль…</div>',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing exact provided lines: ' + repr(missing))
          PY

      - name: Commit only index.html and remove this workflow
        run: |
          rm .github/workflows/insert-exact-cases-section.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/insert-exact-cases-section.yml
          git commit -m 'Insert exact provided cases section'
          git push origin HEAD:claude/landing-page-redesign-bzy3r4
