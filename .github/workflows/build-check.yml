name: Carousel build check

on:
  push:
    branches:
      - claude/landing-page-redesign-bzy3r4
  pull_request:
    branches:
      - claude/landing-page-redesign-bzy3r4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and update lockfile
        run: npm install

      - name: Build project
        run: npm run build

      - name: Commit updated package lock
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "Update package-lock for carousel build"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload generated package lock
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
