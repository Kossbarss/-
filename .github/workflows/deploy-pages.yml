name: Deploy landing to GitHub Pages

on:
  push:
    branches:
      - claude/landing-page-redesign-bzy3r4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build cases carousel assets
        run: npm run build

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '_site/' \
            --exclude 'src/' \
            --exclude 'components/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'server.js' \
            --exclude 'tsconfig.json'
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['GITHUB_SHA']
          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace(
              '</head>',
              f'  <link rel="stylesheet" href="dist/card-fan-carousel.css?v={version}" />\n</head>',
          )
          html = html.replace(
              '<script src="script.js"></script>',
              f'<script src="dist/card-fan-carousel.js?v={version}"></script>\n  <script src="script.js"></script>',
          )
          page.write_text(html, encoding='utf-8')
          Path('_site/.nojekyll').touch()
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
