name: Deploy landing to GitHub Pages

on:
  push:
    branches:
      - claude/landing-page-redesign-bzy3r4
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install exact cases section
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          exact = """<section class="section">
  <div class="container">
    <!-- 1. Заголовок -->
    <div class="section-head"><h2>Это не просто курс…</h2></div>

    <!-- 2. Чат-моксап -->
    <div class="chat-mock">
      <div class="chat-head"><span>Общий чат выпускников школы</span><span>сейчас</span></div>
      <p><span class="author">Марта_ink:</span> Спасибо! 🙏 …</p>
    </div>

    <!-- 3. Підзаголовок -->
    <div class="section-head case-fan-head">
      <span class="kicker">Кейсы учеников</span>
      <h2>Кейсы учеников после обучения</h2>
    </div>

    <!-- 4. Віяло кейсів (малює script.js) -->
    <div class="case-fan-wrap">
      <div class="case-fan-layout" id="caseFanLayout"></div>
      <div class="case-fan-detail" id="caseFanDetail"></div>
      <div class="case-fan-nav" id="caseFanNav" hidden>
        <button class="case-fan-arrow" id="caseFanPrev">‹</button>
        <div class="case-fan-dots" id="caseFanDots"></div>
        <button class="case-fan-arrow" id="caseFanNext">›</button>
      </div>
    </div>

    <!-- 5. CTA: зірки + аватарки-тултіпи + кнопка -->
    <div class="case-fan-cta">
      <div class="stars">★★★★★</div>
      <div class="avatar-row">
        <div class="avatars">
          <div class="avatar-tip">
            <div class="avatar-tip-bubble">…ім'я/країна/роль…</div>
            <span class="avatar"></span>
          </div>
          <!-- ×5 аватарок -->
        </div>
        <span class="count">300+</span>
      </div>
      <a href="#pricing" class="btn btn-stardust"><span class="btn-stardust-wrap">Купить курс и начать обучение тату</span></a>
    </div>
  </div>
</section>"""

          if exact not in html:
              start_marker = '  <!-- ============ CHAT TESTIMONIAL + CASES ============ -->'
              end_marker = '  <!-- ============ WHAT YOU GET ============ -->'
              start = html.find(start_marker)
              end = html.find(end_marker, start)
              if start == -1 or end == -1:
                  raise SystemExit('Cases section boundaries were not found')
              html = html[:start] + exact + '\n\n' + html[end:]
              path.write_text(html, encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          if exact not in updated:
              raise SystemExit('Exact cases section was not installed')
          PY

      - name: Commit exact cases section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Exact cases section is already installed"
          else
            git commit -m "Install exact provided cases section"
            git push origin HEAD:claude/landing-page-redesign-bzy3r4
          fi

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '_site/' \
            --exclude 'src/' \
            --exclude 'components/' \
            --exclude 'dist/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'server.js' \
            --exclude 'tsconfig.json'
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
