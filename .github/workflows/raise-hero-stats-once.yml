name: Raise hero statistics once

on:
  push:
    branches:
      - claude/landing-page-redesign-bzy3r4
    paths:
      - .github/workflows/raise-hero-stats-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjust-spacing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the landing branch
        uses: actions/checkout@v4
        with:
          ref: claude/landing-page-redesign-bzy3r4

      - name: Raise desktop statistics closer to the gallery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('style.css')
          content = path.read_text(encoding='utf-8')
          old = '  margin: -14px auto 32px;'
          new = '  margin: -42px auto 32px;'

          if old in content:
              path.write_text(content.replace(old, new, 1), encoding='utf-8')
          elif new not in content:
              raise SystemExit('Expected hero statistics margin was not found')
          PY

      - name: Commit and push the spacing adjustment
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          if git diff --cached --quiet; then
            echo "Spacing is already updated"
          else
            git commit -m "Raise hero stats closer to gallery"
            git push origin HEAD:claude/landing-page-redesign-bzy3r4
          fi
